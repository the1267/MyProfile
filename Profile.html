<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Security Alert</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            border: 2px solid #0f0;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.7; }
        }
        
        .terminal {
            border: 1px solid #0f0;
            padding: 15px;
            height: 400px;
            overflow: hidden;
        }
        
        .line {
            margin: 5px 0;
            opacity: 0;
            animation: fadeIn 0.5s forwards;
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        .progress-bar {
            width: 100%;
            height: 30px;
            border: 1px solid #0f0;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #0f0;
            width: 0%;
            animation: fill 5s linear forwards;
        }
        
        @keyframes fill {
            to { width: 100%; }
        }
        
        .warning {
            color: #f00;
            font-size: 24px;
            text-align: center;
            margin: 20px 0;
            animation: pulse 0.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .glitch {
            animation: glitch 0.3s infinite;
        }
        
        @keyframes glitch {
            0% { 
                transform: translate(0);
                filter: hue-rotate(0deg);
            }
            20% { 
                transform: translate(-5px, 5px);
                filter: hue-rotate(90deg);
            }
            40% { 
                transform: translate(-5px, -5px);
                filter: hue-rotate(180deg);
            }
            60% { 
                transform: translate(5px, 5px);
                filter: hue-rotate(270deg);
            }
            80% { 
                transform: translate(5px, -5px);
                filter: hue-rotate(360deg);
            }
            100% { 
                transform: translate(0);
                filter: hue-rotate(0deg);
            }
        }
        
        .rgb-glitch {
            position: relative;
        }
        
        .rgb-glitch::before,
        .rgb-glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .rgb-glitch::before {
            animation: glitch-1 0.3s infinite;
            color: #ff00ff;
            z-index: -1;
        }
        
        .rgb-glitch::after {
            animation: glitch-2 0.3s infinite;
            color: #00ffff;
            z-index: -2;
        }
        
        @keyframes glitch-1 {
            0% { transform: translate(0); }
            20% { transform: translate(-3px, 3px); }
            40% { transform: translate(-3px, -3px); }
            60% { transform: translate(3px, 3px); }
            80% { transform: translate(3px, -3px); }
            100% { transform: translate(0); }
        }
        
        @keyframes glitch-2 {
            0% { transform: translate(0); }
            20% { transform: translate(3px, -3px); }
            40% { transform: translate(3px, 3px); }
            60% { transform: translate(-3px, -3px); }
            80% { transform: translate(-3px, 3px); }
            100% { transform: translate(0); }
        }
        
        .rainbow-glitch {
            animation: rainbow 0.5s infinite;
        }
        
        @keyframes rainbow {
            0% { color: #ff0000; text-shadow: 0 0 10px #ff0000; }
            16% { color: #ff7f00; text-shadow: 0 0 10px #ff7f00; }
            32% { color: #ffff00; text-shadow: 0 0 10px #ffff00; }
            48% { color: #00ff00; text-shadow: 0 0 10px #00ff00; }
            64% { color: #0000ff; text-shadow: 0 0 10px #0000ff; }
            80% { color: #8b00ff; text-shadow: 0 0 10px #8b00ff; }
            100% { color: #ff0000; text-shadow: 0 0 10px #ff0000; }
        }

            0% { 
                opacity: 0;
                transform: translateY(-100%);

                    rgba(0,255,0,0.8) 1px, 
                    rgba(0,0,255,0.8) 2px,
                    rgba(255,255,0,0.8) 3px,
                    rgba(255,0,255,0.8) 4px,
                    rgba(0,255,255,0.8) 5px

                    rgba(0,255,0,0.5) 2px,
                    rgba(0,0,255,0.5) 4px,
                    rgba(255,255,0,0.5) 6px

            animation: staticEffect 0.3s linear;

        @keyframes staticEffect {
            0% { 
                opacity: 0;
            }
            50% { 
                opacity: 0.8;
            }
            100% { 
                opacity: 0;
            }
        }

            font-size: 48px;
            text-align: center;
            color: #f00;
            margin: 30px 0;
            font-weight: bold;
            display: none;

        .camera-warning {
            background: #f00;
            color: #fff;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            margin: 20px 0;
            border: 3px solid #fff;
            animation: pulse 0.5s infinite;
            display: none;
        }
        
        .reveal {
            display: none;
            text-align: center;
            padding: 40px;
            font-size: 32px;
            color: #fff;
            animation: fadeIn 1s forwards;

<body>
    <div class="glitch-overlay" id="glitchOverlay"></div>
    <div class="scanline-glitch" id="scanlines"></div>
    <div class="static-glitch" id="static"></div>
    
    <div class="container">
        <div class="header rgb-glitch" data-text="⚠️ SECURITY BREACH DETECTED ⚠️">
            <h1>⚠️ SECURITY BREACH DETECTED ⚠️</h1>
        </div>
        
        <div class="terminal" id="terminal"></div>
        
        <div class="camera-warning" id="camera">
            🔴 CAMERA ACTIVATED - RECORDING IN PROGRESS 🔴
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        
        <div class="warning" id="warning">
            DOWNLOADING FILES...
        </div>
        
        <div class="countdown" id="countdown">
            SELF-DESTRUCT IN: <span id="timer">10</span>
        </div>
        
        <div class="reveal" id="reveal">
            💾 FULL DISK WIPED<br>
            ALL DATA SENT TO: i_paulthegreat 💾
        </div>
    </div>

    <script>
        // Fullscreen with 4-click escape requirement
        let escapeClicks = 0;
        const REQUIRED_CLICKS = 4;
        
        function goFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(() => {});
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }
        
        // Block escape attempts
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement && escapeClicks < REQUIRED_CLICKS) {
                escapeClicks++;
                setTimeout(goFullscreen, 100);
            }
        });
        
        document.addEventListener('webkitfullscreenchange', () => {
            if (!document.webkitFullscreenElement && escapeClicks < REQUIRED_CLICKS) {
                escapeClicks++;
                setTimeout(goFullscreen, 100);
            }
        });
        
        // Attempt fullscreen after user interaction
        let fullscreenAttempted = false;
        document.addEventListener('click', () => {
            if (!fullscreenAttempted) {
                goFullscreen();
                fullscreenAttempted = true;
            }
        });
        
        // Auto-trigger after a delay
        setTimeout(() => {
            if (!fullscreenAttempted) {
                goFullscreen();
                fullscreenAttempted = true;
            }
        }, 1000);
        
        // Get username/computer name
        const username = navigator.userAgent.includes('Windows') ? 'Windows-User' : 
                        navigator.userAgent.includes('Mac') ? 'Mac-User' : 
                        navigator.userAgent.includes('Linux') ? 'Linux-User' : 'User';
        
        const lines = [
            'Initializing remote access protocol...',
            'Bypassing firewall... SUCCESS',
            `Accessing system: ${username}`,
            'Scanning directories: C:\\Users\\${username}\\Documents\\',
            'Found: personal_photos.zip',
            'Found: passwords.txt',
            'Found: bank_details.doc',
            'Found: private_messages.db',
            'Found: browser_history.dat',
            'Establishing connection to remote server...',
            'IP Address: 192.168.1.1',
            'Location: UNKNOWN',
            'Encrypting data packets...',
            'Upload speed: 2.4 MB/s',
            'Transferring files... 15%',
            'Transferring files... 47%',
            'Transferring files... 89%',
            'ACTIVATING WEBCAM...',
            'Camera status: ONLINE',
            'Recording started...',
            'WARNING: Antivirus disabled',
            'Access granted to all systems...',
            'Installing backdoor...',
            'Persistence established...'
        ];
        
        const terminal = document.getElementById('terminal');
        const warning = document.getElementById('warning');
        const reveal = document.getElementById('reveal');
        const camera = document.getElementById('camera');
        const countdown = document.getElementById('countdown');
        const timerSpan = document.getElementById('timer');
        
        let lineIndex = 0;
        
        // Enhanced glitch effects
        function addGlitch() {
            document.body.classList.add('glitch');
            setTimeout(() => {
                document.body.classList.remove('glitch');
            }, 300);
        }
        
        function addRainbowGlitch(element) {
            element.classList.add('rainbow-glitch');
            setTimeout(() => {
                element.classList.remove('rainbow-glitch');
            }, 500);
        }
        
        // Scanline effect
        function triggerScanlines() {
            const scanlines = document.getElementById('scanlines');
            scanlines.style.opacity = '1';
            scanlines.style.animation = 'scanlines 0.3s linear';
            setTimeout(() => {
                scanlines.style.opacity = '0';
            }, 300);
        }
        
        // Static effect
        function triggerStatic() {
            const static = document.getElementById('static');
            static.style.opacity = '1';
            static.style.animation = 'staticEffect 0.3s linear';
            setTimeout(() => {
                static.style.opacity = '0';
            }, 300);
        }
        
        // Trigger scanlines every 3-5 seconds
        setInterval(() => {
            if (Math.random() > 0.3) {
                triggerScanlines();
            }
        }, 3000);
        
        // Trigger static every 4-6 seconds
        setInterval(() => {
            if (Math.random() > 0.4) {
                triggerStatic();
            }
        }, 4000);
        
        // Sometimes trigger both together for intense effect
        setInterval(() => {
            if (Math.random() > 0.7) {
                triggerScanlines();
                setTimeout(triggerStatic, 150);
            }
        }, 5000);
        
        // Random glitches with rainbow effects
        setInterval(() => {
            if (Math.random() > 0.6) {
                addGlitch();
                
                // Sometimes add rainbow to warning text
                if (Math.random() > 0.5) {
                    addRainbowGlitch(warning);
                }
            }
        }, 1500);
        
        // Flash the fullscreen RGB glitch image randomly
        const glitchOverlay = document.getElementById('glitchOverlay');
        setInterval(() => {
            if (Math.random() > 0.7) {
                glitchOverlay.classList.add('active');
                setTimeout(() => {
                    glitchOverlay.classList.remove('active');
                }, 150 + Math.random() * 200); // Flash for 150-350ms
            }
        }, 2000 + Math.random() * 3000); // Every 2-5 seconds
        
        function addLine() {
            if (lineIndex < lines.length) {
                const line = document.createElement('div');
                line.className = 'line';
                line.textContent = '> ' + lines[lineIndex];
                line.style.animationDelay = '0s';
                terminal.appendChild(line);
                terminal.scrollTop = terminal.scrollHeight;
                
                // Show camera warning when webcam line appears
                if (lineIndex === 17) {
                    camera.style.display = 'block';
                    addRainbowGlitch(camera);
                }
                
                // Random rainbow glitches on certain lines
                if (Math.random() > 0.7) {
                    addRainbowGlitch(line);
                }
                
                lineIndex++;
                
                const delay = Math.random() * 400 + 150;
                setTimeout(addLine, delay);
            } else {
                // Start countdown
                setTimeout(() => {
                    warning.style.display = 'none';
                    countdown.style.display = 'block';
                    
                    let count = 10;
                    const countInterval = setInterval(() => {
                        count--;
                        timerSpan.textContent = count;
                        addGlitch();
                        addRainbowGlitch(countdown);
                        
                        // Extra intense glitches during countdown
                        if (Math.random() > 0.5) {
                            triggerScanlines();
                        }
                        if (Math.random() > 0.6) {
                            triggerStatic();
                        }
                        
                        if (count <= 0) {
                            clearInterval(countInterval);
                            countdown.style.display = 'none';
                            camera.style.display = 'none';
                            reveal.style.display = 'block';
                            addRainbowGlitch(reveal);
                            
                            // Final mega glitch
                            triggerScanlines();
                            setTimeout(triggerStatic, 100);
                        }
                    }, 1000);
                }, 1000);
            }
        }
        
        setTimeout(addLine, 500);
        
        const warnings = [
            'DOWNLOADING FILES...',
            'ACCESSING CAMERA...',
            'UPLOADING DATA...',
            'SYSTEM COMPROMISED...',
            'ENCRYPTING DISK...'
        ];
        
        let warningIndex = 0;
        setInterval(() => {
            warningIndex = (warningIndex + 1) % warnings.length;
            warning.textContent = warnings[warningIndex];
        }, 2000);
    </script>
